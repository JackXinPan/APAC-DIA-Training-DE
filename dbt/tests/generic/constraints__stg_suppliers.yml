version: 2

models:
  - name: stg_suppliers
    description: "Staging model for suppliers"
    columns:
      - name: supplier_id
        data_type: bigint
        description: "Unique supplier identifier"
        tests: 
          - not_null
          - unique
      - name: supplier_code
        data_type: string
        description: "Supplier code"
        tests: 
          - not_null
          - unique
      - name: name
        data_type: string
        description: "Supplier name"
      - name: country_code
        data_type: string
        description: "Country code of the supplier"
      - name: lead_time_days
        data_type: int
        description: "Lead time in days"
      - name: preferred
        data_type: boolean
        description: "Preferred supplier flag"
      - name: ingestion_ts
        data_type: timestamp
        description: "Ingestion timestamp"