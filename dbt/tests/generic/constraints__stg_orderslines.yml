
version: 2

models:
  - name: stg_orderslines
    description: "Staging model for order line items"   
    tests:
      - compositekey:
          column_names: ['order_id', 'line_number']
    columns:
      - name: order_id
        data_type: bigint
        description: "Order identifier"
        tests: [not_null, unique]
      - name: line_number
        data_type: int
        description: "Line number within the order"
        tests: [not_null]
      - name: product_id
        data_type: bigint
        description: "Product identifier"
        tests:
          - relationships:
              to: ref('stg_products')
              field: product_id
          - foreign_key_violation_rate:
              parent_model: ref('stg_products')
              parent_key: product_id
      - name: qty
        data_type: int
        description: "Quantity ordered"
      - name: unit_price
        data_type: decimal(12, 4)
        description: "Unit price of the product"
        tests: [not_null, not_negative]
      - name: line_discount_pct
        data_type: decimal(5, 4)
        description: "Discount percentage applied to the line"
      - name: tax_pct
        data_type: decimal(5, 4)
        description: "Tax percentage applied"
      - name: ingestion_ts
        data_type: timestamp
        description: "Ingestion timestamp"