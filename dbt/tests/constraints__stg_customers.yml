version: 2

models:
  - name: stg_customers
    description: "Staging model for customers with enforced column contracts"
    columns:
      - name: customer_id
        data_type: bigint
        description: "Unique customer identifier"
        tests: [not_null, unique]
      - name: natural_key
        data_type: string
        description: "Natural key for the customer"
        tests: [not_null, unique]
      - name: first_name
        data_type: string
        description: "Customer's first name"
      - name: last_name
        data_type: string
        description: "Customer's last name"
      - name: email
        data_type: string
        description: "Customer's email address"
      - name: phone
        data_type: string
        description: "Customer's phone number"
      - name: address_line1
        data_type: string
        description: "Primary address line"
      - name: address_line2
        data_type: string
        description: "Secondary address line"
      - name: city
        data_type: string
        description: "City of residence"
      - name: state_region
        data_type: string
        description: "State or region"
      - name: postcode
        data_type: string
        description: "Postal code"
      - name: country_code
        data_type: string
        description: "Country code"
      - name: latitude
        data_type: double
        description: "Latitude coordinate"
      - name: longitude
        data_type: double
        description: "Longitude coordinate"
      - name: birth_date
        data_type: date
        description: "Date of birth"
      - name: join_ts
        data_type: timestamp
        description: "Timestamp when the customer joined"
      - name: is_vip
        data_type: boolean
        description: "VIP status flag"
      - name: gdpr_consent
        data_type: boolean
        description: "GDPR consent flag"

